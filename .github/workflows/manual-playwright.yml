name: Manual Playwright

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Playwright suite to run.
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - auth
          - regression
          - purchasing
          - validation
          - visual
          - destructive
          - custom-grep
      browser_project:
        description: Browser project to run.
        required: true
        default: chromium-desktop
        type: choice
        options:
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop
          - chromium-mobile
          - all-desktop
      custom_grep:
        description: 'Required only when suite is custom-grep. Example: @cart|@payment'
        required: false
        default: ''
        type: string
      run_payment_e2e:
        description: Enable destructive checkout gates.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  E2E_BROWSER_PROJECT: ${{ inputs.browser_project }}
  RUN_PAYMENT_E2E: ${{ inputs.run_payment_e2e }}
  AUTH_TEST_EMAIL: ${{ secrets.AUTH_TEST_EMAIL }}
  AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}

jobs:
  playwright:
    name: ${{ inputs.suite }} on ${{ inputs.browser_project }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install selected Playwright browsers
        shell: bash
        run: |
          case "${{ inputs.browser_project }}" in
            chromium-desktop)
              npx playwright install --with-deps chromium
              ;;
            firefox-desktop)
              npx playwright install --with-deps firefox
              ;;
            webkit-desktop)
              npx playwright install --with-deps webkit
              ;;
            chromium-mobile)
              npx playwright install --with-deps chromium
              ;;
            all-desktop)
              npx playwright install --with-deps chromium firefox webkit
              ;;
            *)
              echo "Unsupported browser project: ${{ inputs.browser_project }}" >&2
              exit 1
              ;;
          esac

      - name: Run selected suite
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          CUSTOM_GREP: ${{ inputs.custom_grep }}
        run: |
          set -euo pipefail

          pass_with_no_tests=()
          grep_invert=()
          production_excludes='@payment|@slow|@destructive|@visual'

          case "$SUITE" in
            smoke)
              grep='@smoke'
              grep_invert=(--grep-invert "$production_excludes")
              ;;
            auth)
              grep='@auth'
              grep_invert=(--grep-invert '@payment|@slow|@destructive|@visual')
              ;;
            regression)
              grep='@regression'
              grep_invert=(--grep-invert "$production_excludes")
              ;;
            purchasing)
              grep='@purchasing'
              grep_invert=(--grep-invert '@payment|@slow|@destructive')
              ;;
            validation)
              grep='@validation'
              ;;
            visual)
              grep='@visual'
              ;;
            destructive)
              if [ "${{ inputs.run_payment_e2e }}" != "true" ]; then
                echo "run_payment_e2e must be true for destructive." >&2
                exit 1
              fi
              grep='@destructive'
              ;;
            custom-grep)
              if [ -z "$CUSTOM_GREP" ]; then
                echo "custom_grep is required when suite is custom-grep." >&2
                exit 1
              fi
              grep="$CUSTOM_GREP"
              pass_with_no_tests=(--pass-with-no-tests)
              ;;
            *)
              echo "Unsupported suite: $SUITE" >&2
              exit 1
              ;;
          esac

          npx playwright test --grep "$grep" "${grep_invert[@]}" "${pass_with_no_tests[@]}"

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: manual-playwright-${{ inputs.suite }}-${{ inputs.browser_project }}-${{ github.run_attempt }}
          retention_days: 14

  allure-report:
    name: Publish Allure report with history
    needs: playwright
    if: ${{ always() && github.ref == 'refs/heads/production' && needs.playwright.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: manual-playwright-${{ inputs.suite }}-${{ inputs.browser_project }}-${{ github.run_attempt }}
          report_name: Manual Playwright ${{ inputs.suite }} on ${{ inputs.browser_project }}
          report_slug: manual-playwright-${{ inputs.suite }}-${{ inputs.browser_project }}
