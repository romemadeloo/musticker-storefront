name: Edge case tests

on:
  schedule:
    # 04:00 Asia/Manila every day.
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - production-mode-test-suite
    paths:
      - '.github/workflows/edgecase.yml'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: edgecase-tests
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  BYPASS_ARTWORK_UPLOAD: 'false'
  RUN_ORDER_ALL_PRODUCTS_E2E: 'false'
  RUN_PAYMENT_E2E: 'false'
  SKIP_SEEDED_AUTH_SETUP: 'true'
  TEST_USER_EMAIL: ${{ secrets.PRODUCTION_TEST_USER_EMAIL || secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.PRODUCTION_TEST_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}

jobs:
  edgecase:
    name: Run edge case suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run desktop edge cases
        env:
          E2E_BROWSER_PROJECT: chromium-desktop
        run: npm run test:e2e:edgecase

      - name: Run mobile edge cases
        if: ${{ always() }}
        env:
          E2E_BROWSER_PROJECT: chromium-mobile
        run: npm run test:e2e:edgecase

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: edgecase-results
          retention_days: 14

  allure-report:
    name: Publish Allure report with history
    needs: edgecase
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.edgecase.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          artifact_name: edgecase-results
          report_name: Edge case tests
          report_slug: edgecase
