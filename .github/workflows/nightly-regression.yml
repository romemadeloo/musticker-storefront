name: Nightly regression

on:
  schedule:
    # 02:00 Asia/Manila every day.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  BYPASS_ARTWORK_UPLOAD: 'false'
  E2E_BROWSER_PROJECT: chromium-desktop
  NIGHTLY_ALLURE_HISTORY_URL: ${{ vars.NIGHTLY_ALLURE_HISTORY_URL }}
  RUN_ORDER_ALL_PRODUCTS_E2E: 'false'
  RUN_PAYMENT_E2E: 'false'
  SKIP_SEEDED_AUTH_SETUP: 'true'
  TEST_USER_EMAIL: ${{ secrets.PRODUCTION_TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.PRODUCTION_TEST_USER_PASSWORD }}

jobs:
  regression:
    name: Production-safe regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full regression suite
        run: npx playwright test --grep "@regression|@checkout|@coupon|@points|@admin" --grep-invert "@payment|@slow|@api|@setup|@destructive"

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: nightly-regression-playwright-results
          retention_days: 14

  allure-report:
    name: Publish Allure report with history
    needs: regression
    if: ${{ always() && needs.regression.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download nightly regression artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-regression-playwright-results

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore previous Allure history
        shell: bash
        run: |
          set -euo pipefail

          history_url="${NIGHTLY_ALLURE_HISTORY_URL:-}"
          if [ -z "$history_url" ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            repo="${GITHUB_REPOSITORY#*/}"
            history_url="https://${owner}.github.io/${repo}/history"
          fi

          history_url="${history_url%/}"
          mkdir -p allure-results/history

          restored=0
          for file in categories-trend.json duration-trend.json history-trend.json history.json retry-trend.json; do
            if curl --fail --silent --show-error --location "$history_url/$file" --output "allure-results/history/$file"; then
              restored=$((restored + 1))
            else
              rm -f "allure-results/history/$file"
            fi
          done

          if [ "$restored" -gt 0 ]; then
            echo "Restored $restored Allure history file(s) from $history_url."
          else
            echo "No previous Allure history found at $history_url; publishing a fresh report."
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Allure report for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        id: deploy_allure
        uses: actions/deploy-pages@v4

      - name: Add Allure report link to summary
        shell: bash
        run: |
          {
            echo "### Nightly Allure report"
            echo ""
            echo "[Open the nightly regression Allure report](${{ steps.deploy_allure.outputs.page_url }})"
          } >> "$GITHUB_STEP_SUMMARY"
