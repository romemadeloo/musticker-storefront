name: Nightly regression

on:
  schedule:
    # 02:00 Asia/Manila every day.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  BYPASS_ARTWORK_UPLOAD: 'false'
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_ORDER_ALL_PRODUCTS_E2E: 'false'
  RUN_PAYMENT_E2E: 'false'
  SKIP_SEEDED_AUTH_SETUP: 'true'
  TEST_USER_EMAIL: ${{ secrets.PRODUCTION_TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.PRODUCTION_TEST_USER_PASSWORD }}

jobs:
  regression:
    name: Production-safe regression
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full regression suite
        run: npx playwright test --grep "@regression|@checkout|@coupon|@points|@admin" --grep-invert "@payment|@slow|@api|@setup|@destructive"

      - name: Collect Playwright and Allure artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: nightly-regression-playwright-results
          retention_days: 14
