name: Nightly regression

on:
  schedule:
    # 02:00 Asia/Manila every day.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_PAYMENT_E2E: 'false'
  AUTH_TEST_EMAIL: ${{ secrets.AUTH_TEST_EMAIL }}
  AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}

jobs:
  regression:
    name: Production-safe regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full regression suite
        run: npm run test:regression

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: nightly-regression-playwright-results
          retention_days: 14

  allure-report:
    name: Publish Allure report with history
    needs: regression
    if: ${{ always() && github.ref == 'refs/heads/production' && needs.regression.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: nightly-regression-playwright-results
          fallback_root_history: 'true'
          history_url: ${{ vars.NIGHTLY_ALLURE_HISTORY_URL }}
          report_name: Nightly regression
          report_slug: nightly-regression
