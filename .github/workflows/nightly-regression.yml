name: Nightly regression

on:
  schedule:
    # 02:00 Asia/Manila every day.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: How many parallel shards to split the suite across.
        required: true
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'

permissions:
  contents: read

concurrency:
  group: nightly-regression
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_PAYMENT_E2E: 'false'
  AUTH_TEST_EMAIL: ${{ secrets.AUTH_TEST_EMAIL }}
  AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
  # WAF exemption for the CI egress IP, issued by the site owner. Without it the storefront answers
  # bare 403s under full-suite load -- on documents and on their subresources. Absent or empty is
  # supported: tests/fixtures/internal-origin.ts becomes a no-op and the retry ladder in
  # navigation.ts carries the run instead.
  #
  # Both tiers are passed unconditionally rather than picked with a ternary here: env.ts chooses by
  # target environment, so a run can never be handed the key for a host it is not pointed at.
  INTERNAL_ORIGIN_KEY: ${{ secrets.INTERNAL_ORIGIN_KEY }}
  DEV_INTERNAL_ORIGIN_KEY: ${{ secrets.DEV_INTERNAL_ORIGIN_KEY }}
  # Each shard emits a merge-able blob report instead of a partial HTML one; the merge job below
  # turns them back into a single report. See reportersForShardedRun in playwright.config.ts.
  PW_BLOB_REPORT: 'true'

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}

    steps:
      - name: Resolve shard count
        id: plan
        shell: bash
        env:
          REQUESTED_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '4' }}
        run: |
          set -euo pipefail

          total="$REQUESTED_SHARDS"

          if ! [[ "$total" =~ ^[1-9][0-9]?$ ]]; then
            echo "Invalid shard count: $total" >&2
            exit 1
          fi

          shards="[$(seq -s, 1 "$total")]"

          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Splitting the suite across $total shard(s): $shards"

  regression:
    name: Production-safe regression (shard ${{ matrix.shard }}/${{ needs.plan.outputs.total }})
    needs: plan
    runs-on: ubuntu-latest
    # Per shard rather than for the whole suite. Unsharded, this job ran the entire @regression
    # selection -- over 2,000 tests, most of them the data-driven pricing checks -- through two
    # workers inside a single 90-minute budget, so a slow night timed out instead of reporting.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run regression shard
        run: npm run test:regression -- --shard=${{ matrix.shard }}/${{ needs.plan.outputs.total }}

      - name: Upload shard results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: nightly-regression-shard-${{ matrix.shard }}
          path: |
            blob-report/
            allure-results/
            test-results/
          retention-days: 14

  merge-reports:
    name: Merge shard reports
    needs: regression
    # Runs even when a shard failed: a failing suite is exactly when the combined report matters.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      allure_results_found: ${{ steps.merge.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Merge shard reports
        id: merge
        uses: ./.github/actions/merge-shard-reports
        with:
          artifact_name: nightly-regression-playwright-results
          retention_days: 14
          shard_artifact_pattern: nightly-regression-shard-*

  allure-report:
    name: Publish Allure report with history
    needs: merge-reports
    if: ${{ always() && github.ref == 'refs/heads/production' && needs.merge-reports.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: nightly-regression-playwright-results
          fallback_root_history: 'true'
          history_url: ${{ vars.NIGHTLY_ALLURE_HISTORY_URL }}
          report_name: Nightly regression
          report_slug: nightly-regression
