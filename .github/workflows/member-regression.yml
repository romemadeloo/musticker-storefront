name: Member regression

on:
  schedule:
    # 03:00 Asia/Manila every day.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: member-regression
  cancel-in-progress: false

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.DEV_BASE_URL || 'https://dev.musticker.com/kr' }}
  BYPASS_ARTWORK_UPLOAD: 'false'
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_ORDER_ALL_PRODUCTS_E2E: 'false'
  RUN_PAYMENT_E2E: 'true'
  SKIP_SEEDED_AUTH_SETUP: 'true'

jobs:
  member-regression:
    name: Run member regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run member purchase regression
        run: npm run test:e2e:member-regression

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: member-regression-results
          retention_days: 14

  allure-report:
    name: Publish Allure report with history
    needs: member-regression
    if: ${{ always() && github.ref == 'refs/heads/main' && needs['member-regression'].outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          artifact_name: member-regression-results
          report_name: Member regression
          report_slug: member-regression
