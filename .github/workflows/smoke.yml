name: Storefront smoke

on:
  push:
    branches:
      - develop
      - production

permissions:
  contents: read

concurrency:
  group: buyer-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: >-
    ${{ (github.ref == 'refs/heads/develop' && (vars.DEV_BASE_URL || 'https://dev-3.musticker.com/kr'))
    || (vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr') }}
  API_BASE_URL: >-
    ${{ (github.ref == 'refs/heads/develop' && (vars.DEV_API_BASE_URL || 'https://dev-3-api.musticker.com/index.php'))
    || (vars.PRODUCTION_API_BASE_URL || 'https://api.musticker.com/index.php') }}
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_PAYMENT_E2E: 'false'
  AUTH_TEST_EMAIL: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_AUTH_TEST_EMAIL || secrets.AUTH_TEST_EMAIL }}
  AUTH_TEST_PASSWORD: ${{ github.ref == 'refs/heads/develop' && secrets.DEV_AUTH_TEST_PASSWORD || secrets.AUTH_TEST_PASSWORD }}

jobs:
  smoke:
    name: Storefront smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run storefront smoke coverage
        run: npx playwright test --grep @smoke --grep-invert "@payment|@slow|@destructive|@visual"

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: storefront-smoke-playwright-results
          retention_days: 7

  allure-report:
    name: Publish Allure report with history
    needs: smoke
    if: ${{ always() && github.ref == 'refs/heads/production' && needs.smoke.outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          allure_service_access_token: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
          artifact_name: storefront-smoke-playwright-results
          report_name: Storefront smoke
          report_slug: storefront-smoke
