name: Buyer smoke

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: buyer-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLURE_RESULTS_DIR: allure-results
  BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://www.musticker.com/kr' }}
  E2E_BROWSER_PROJECT: chromium-desktop
  RUN_PAYMENT_E2E: 'false'
  RUN_ORDER_ALL_PRODUCTS_E2E: 'false'
  SKIP_SEEDED_AUTH_SETUP: 'true'
  TEST_USER_EMAIL: ${{ secrets.PRODUCTION_TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.PRODUCTION_TEST_USER_PASSWORD }}

jobs:
  buyer-flow:
    name: Important buyer flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      allure_results_found: ${{ steps.test_artifacts.outputs.allure_results_found }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run buyer smoke coverage
        run: npx playwright test --grep "@smoke|@search|@product|@cart" --grep-invert "@slow|@payment|@validation|@error-handling|@api|@setup|@destructive"

      - name: Collect Playwright and Allure artifacts
        id: test_artifacts
        if: ${{ always() }}
        uses: ./.github/actions/playwright-artifacts
        with:
          artifact_name: buyer-smoke-playwright-results
          retention_days: 7

  allure-report:
    name: Publish Allure report with history
    needs: buyer-flow
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs['buyer-flow'].outputs.allure_results_found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.publish_allure.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Allure report
        id: publish_allure
        uses: ./.github/actions/publish-allure-report
        with:
          artifact_name: buyer-smoke-playwright-results
          report_name: Buyer smoke
          report_slug: buyer-smoke
