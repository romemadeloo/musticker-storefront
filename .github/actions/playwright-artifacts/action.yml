name: Playwright artifacts
description: Generate Allure report and upload Playwright test artifacts.

inputs:
  artifact_name:
    description: Artifact name to publish.
    required: true
  retention_days:
    description: Number of days to retain the artifact.
    required: false
    default: '14'

outputs:
  allure_results_found:
    description: Whether allure-results contained files.
    value: ${{ steps.allure_results.outputs.found }}

runs:
  using: composite
  steps:
    - name: Check Allure results
      id: allure_results
      shell: bash
      run: |
        if [ ! -d allure-results ] || [ -z "$(find allure-results -type f -print -quit)" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No Allure results were found."
          exit 0
        fi

        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Set up Java for Allure
      if: ${{ steps.allure_results.outputs.found == 'true' }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Generate Allure report
      if: ${{ steps.allure_results.outputs.found == 'true' }}
      shell: bash
      run: npx allure generate allure-results --clean -o allure-report

    - name: Upload Playwright and Allure artifacts
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: ${{ inputs.artifact_name }}
        path: |
          allure-results/
          allure-report/
          test-results/
          playwright-report/
        retention-days: ${{ inputs.retention_days }}
